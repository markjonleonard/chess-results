[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

[project]
# Repository, distribution and import name all agree. The "-py" suffix belongs
# to multi-language client families (redis-py alongside redis-rb, node-redis);
# there is no such family here, so it would claim one that does not exist.
name = "chess-results"
description = "Standings, pairings, colour histories and printable pairing sheets from chess-results.com, as text or JSON, with tournament search and TRF(x) export"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Leonard" }]
keywords = ["chess", "chess-results", "swiss", "pairings", "fide", "scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
    "Typing :: Typed",
]
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "requests-cache>=1.0"]
dynamic = ["version", "readme"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-requests",
    "types-beautifulsoup4",
]

[project.scripts]
chess-results = "chess_results.cli:main"

[project.urls]
Homepage = "https://github.com/markjonleonard/chess-results"
Issues = "https://github.com/markjonleonard/chess-results/issues"

[tool.hatch.version]
path = "src/chess_results/__init__.py"

# The README is PyPI's long description, and its links point at main so they stay
# current on GitHub. On PyPI they must describe the version installed instead, so
# the build rewrites them to that release's tag: $HFPR_VERSION is the version being
# built, and the release workflow tags v<version>. GitHub's README is untouched.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'https://github\.com/markjonleonard/chess-results/(blob|tree)/main/'
replacement = 'https://github.com/markjonleonard/chess-results/\1/v$HFPR_VERSION/'

# A link to the repository's front page with an anchor is a link into the README.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'https://github\.com/markjonleonard/chess-results#'
replacement = 'https://github.com/markjonleonard/chess-results/blob/v$HFPR_VERSION/README.md#'

[tool.hatch.build.targets.wheel]
packages = ["src/chess_results"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.format]
# ruff 0.16 began formatting Python blocks inside Markdown, which reflows the
# aligned trailing comments the README and DESIGN examples rely on. Prose is not
# the formatter's business, and pinning the behaviour here keeps CI from
# disagreeing with a developer on an older ruff.
exclude = ["*.md"]

[tool.ruff.lint]
# ANN, D and S are deliberately absent: a test suite is meant to be full of bare
# asserts, and `--select ALL` reports 549 findings of which only a handful were
# ever actionable.
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "C4", "PTH", "RUF"]
