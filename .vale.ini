StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = write-good, proselint

Vocab = chess-results

[*.md]
BasedOnStyles = Vale, write-good, proselint, British

# Vale bundles en_US only, so its spelling check is replaced by British.Spelling,
# which reads an en_GB Hunspell dictionary.
Vale.Spelling = NO

# Prose here is deliberately explanatory rather than instructional, and the
# passive is often the honest voice for describing what a website does to us.
write-good.Passive = NO
write-good.Weasel = warning
write-good.So = NO
write-good.TooWordy = suggestion

# E-Prime bans the verb "to be" outright. That is a writing experiment, not
# advice: "a Play is what one player did in one round" has no better form.
write-good.E-Prime = NO

proselint.Typography = NO
