name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      # predict_ecf_rating.py imports the sibling ecf-rating package on purpose
      # (see its docstring) -- that package deliberately stays out of this
      # project's dependencies, so it is never installed here and mypy cannot
      # resolve it. Exclude just that file rather than weakening --strict.
      - run: mypy --strict --exclude '^examples/predict_ecf_rating\.py$' src/chess_results examples

  docs:
    runs-on: ubuntu-latest
    env:
      # Pinned, unlike the Python tooling: a prose linter's rules are opinions,
      # and a new release changing them would fail a build on unchanged prose.
      VALE_VERSION: "3.17.1"
      DICTIONARIES: https://raw.githubusercontent.com/LibreOffice/dictionaries/master/en
    steps:
      - uses: actions/checkout@v7
      - name: Install Vale
        run: |
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
      - name: Fetch styles and the en_GB dictionary
        run: |
          vale sync
          mkdir -p .vale/styles/config/dictionaries
          for f in en_GB.aff en_GB.dic; do
            curl -sSfL -o ".vale/styles/config/dictionaries/$f" "${DICTIONARIES}/$f"
          done
      # Only the markdown git tracks: this skips build artefacts, Vale's own
      # downloaded documentation, and any personal notes left in the checkout.
      # Errors fail the build; warnings are advisory, some hedges being honest.
      - run: vale --minAlertLevel=error $(git ls-files '*.md')

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The suite is fully offline — fixtures only, no network, no secrets.
      - run: pytest -q
